version: "3.9"

services:
  fastapi-rag:
    build: ./fastapi-rag
    container_name: fastapi-rag
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CHROMA_PATH=/data/chroma
    volumes:
      - chroma_data:/data/chroma
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=rag_assistant
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
  # spring-boot-core:
  #   build: ./spring-boot-core
  #   container_name: spring-boot-core
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - mysql
  #     - fastapi-rag
  #   environment:
  #     - RAG_SERVICE_URL=http://fastapi-rag:8000
  #     - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/rag_assistant

volumes:
  chroma_data:
  mysql_data:
